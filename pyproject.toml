[project]
name = "llms-tp3"
version = "0.1.0"
description = "RAG para corregir dependencias alucinadas o deprecadas en código Python"
requires-python = ">=3.11"
dependencies = [
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.7.0",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "pypandoc-binary>=1.17",
    "python-dotenv>=1.2.4",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
local = [  # embedders locales (E3 a E5); transformers<5 porque el código remoto de jina-code no anda con la 5
    "einops>=0.8.2",
    "sentence-transformers>=5,<6",
    "transformers<5",
]
analysis = [  # gráficos de los resultados (src/tprag/eval/plots.py)
    "matplotlib>=3.9",
]

[build-system]
requires = ["uv_build>=0.10.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tprag"

[tool.pytest.ini_options]
testpaths = ["tests"]  # data/raw tiene test_*.py de la documentación (p. ej. fastapi/docs_src) que no son nuestros
